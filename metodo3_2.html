<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>querySelector - Propiedades</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #1d4ed8;
            --primary-dark: #1e3a8a;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-color: #cbd5e1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 2.5rem;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(29, 78, 216, 0.1);
        }
        h1 { color: var(--primary-dark); font-size: 1.5rem; margin-bottom: 1rem; }
        p { color: var(--text-muted); margin-bottom: 1.5rem; }
        .resultado {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 1.2rem;
            margin: 1.5rem 0;
        }
        /* Estilo para el botón de la práctica */
        .btn-accion {
            background-color: #e2e8f0;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.6rem 1.2rem;
            border-radius: 0.4rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-accion:disabled {
            background-color: #cbd5e1;
            color: #64748b;
            cursor: not-allowed;
        }
        .btn {
            background-color: var(--primary-blue);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            margin-top: 1rem;
        }
        .btn:hover { background-color: var(--primary-dark); }
        .back { display: inline-block; margin-top: 1.5rem; color: var(--primary-blue); text-decoration: none; font-weight: 600; }
        .back:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Deshabilitar Elemento con querySelector</h1>
        <p>Modificación de propiedades de estado en tiempo de ejecución.</p>
        
        <div class="resultado">
            <button class="btn-accion btn">Enviar</button>
        </div>

        <button class="btn" onclick="deshabilitarBoton()">Ejecutar querySelector (Deshabilitar)</button>
        <div>
            <a href="../../../segundo_parcial.html" class="back">&larr; Volver al Segundo Parcial</a>
        </div>
    </div>

    <script>
        function deshabilitarBoton() {
            document.querySelector(".btn").disabled = true;
        }
    </script>
</body>
</html>
